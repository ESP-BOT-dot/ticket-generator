<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticket Dive</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap");
:root{--bg:#eef4fa;--accent:#4a90e2;--w1:#fff;--b1:#2c3e50;--b3:#7f8c9a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:62.5%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--b1);font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;overflow-x:hidden;}
.page{min-height:100vh;max-width:48rem;margin:0 auto;padding:6.8rem 0 10rem;position:relative;}
.header{
position:fixed;top:0;left:50%;transform:translateX(-50%);
width:100%;max-width:48rem;height:6.4rem;z-index:30;
background:rgba(255,255,255,.97);
display:flex;align-items:center;justify-content:space-between;
padding:0 1.6rem;border-bottom:1px solid rgba(0,0,0,.05);
}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:900;font-size:1.9rem;letter-spacing:-0.3px;}
.logo-icon{width:2.8rem;height:2.8rem;background:linear-gradient(135deg,#f3981c,#e95389,#2badd7);border-radius:.6rem;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:1.4rem;}
.header-right{display:flex;align-items:center;gap:1.8rem;}
.search{width:2.4rem;height:2.4rem;color:#555;display:flex;align-items:center;justify-content:center;}
.login-btn{background:linear-gradient(90deg,#7eb6f0,#5aa0e6);color:#fff;border:none;border-radius:2rem;padding:.8rem 1.6rem;font-size:1.3rem;font-weight:700;}
.ticket-section{position:relative;z-index:2;padding:1.6rem 2rem 0;}
.ticket{width:100%;max-width:36rem;margin:0 auto;position:relative;filter:drop-shadow(0 6px 20px rgba(0,0,0,.12));}
.image-area{width:100%;aspect-ratio:1/1.2;position:relative;overflow:hidden;background:#eef4fa;border-radius:1.2rem 1.2rem 0 0;}
.image-blur{position:absolute;inset:-10%;background:center/cover no-repeat;filter:blur(12px);transform:scale(1.1);z-index:0;}
.image-main{position:absolute;inset:0;background:center/contain no-repeat;z-index:1;}
.stamp{display:none;position:absolute;right:.6rem;bottom:.6rem;width:16rem;height:16rem;z-index:20;border-radius:50%;background:rgba(255,255,255,.92);pointer-events:none;}
.stamp.show{display:block;}
.stamp .c1,.stamp .c2{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:2.5px solid #ff0000;}
.stamp .c1{width:15.6rem;height:15.6rem;}
.stamp .c2{width:14.8rem;height:14.8rem;border-width:1.2px;}
.stamp .top,.stamp .bot{position:absolute;left:0;right:0;color:#ff0000;font-size:1.6rem;font-weight:700;text-align:center;}
.stamp .top{top:1.5rem;}
.stamp .bot{bottom:1.5rem;transform:rotate(180deg);}
.stamp .time{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-size:2.7rem;font-weight:700;color:#ff0000;text-align:center;}
.details{background:#fff;padding:1.8rem 2rem 1.6rem;position:relative;}
.details::before,.details::after{content:"";position:absolute;width:2.2rem;height:2.2rem;background:var(--bg);border-radius:50%;top:4.8rem;z-index:5;}
.details::before{left:-1.1rem;}
.details::after{right:-1.1rem;}
.title{font-size:2.3rem;font-weight:800;line-height:1.25;margin-bottom:.5rem;}
.venue{font-size:1.4rem;font-weight:600;color:var(--b3);margin-bottom:1.4rem;}
.date-row{display:flex;align-items:flex-end;gap:.8rem;margin-bottom:1.6rem;}
.date{font-size:3.2rem;font-weight:800;line-height:1;}
.weekday{font-size:1.6rem;font-weight:700;margin-bottom:.3rem;}
.times{margin-left:auto;font-size:1.2rem;color:var(--b3);text-align:center;line-height:1.35;}
.times b{color:var(--b1);font-weight:700;font-size:1.5rem;}
.bottom-info{display:flex;justify-content:space-between;align-items:center;padding-top:1.4rem;border-top:1px dashed #e8eef5;}
.name-area{font-size:1.4rem;line-height:1.5;}
.name{font-weight:700;}
.favorite{font-size:1.3rem;color:var(--b3);}
.ticket-name{font-weight:700;margin-top:.2rem;}
.number{background:var(--accent);color:#fff;font-size:2.2rem;font-weight:900;padding:1rem 1.4rem;border-radius:.5rem;min-width:7.5rem;text-align:center;}
.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:48rem;background:rgba(255,255,255,.95);padding:1.2rem 1.6rem 2.2rem;display:flex;justify-content:center;border-top:1px solid rgba(0,0,0,.05);}
.enter-btn{width:100%;max-width:32rem;height:5.6rem;background:linear-gradient(90deg,#7eb6f0,#5aa0e6);color:#fff;border:none;border-radius:3rem;font-size:1.6rem;font-weight:700;cursor:pointer;}
.enter-btn.done{background:#c6c6c6;}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:center;justify-content:center;padding:2rem;}
.modal-backdrop.show{display:flex;}
.modal{background:#fff;border-radius:1.2rem;width:100%;max-width:34rem;padding:6.5rem 2.4rem 3.5rem;position:relative;text-align:center;box-shadow:0 1rem 3rem rgba(0,0,0,.25);}
.modal-close{position:absolute;top:1rem;right:1.2rem;background:none;border:none;font-size:3.2rem;color:#5d5550;cursor:pointer;}
.modal-warning{color:#ff0000;font-size:2.1rem;font-weight:900;margin-bottom:1.2rem;animation:glow 1s infinite;}
@keyframes glow{0%,100%{text-shadow:0 0 5px rgba(255,0,0,.45)}50%{text-shadow:0 0 12px rgba(255,0,0,.8)}}
.modal-title{font-size:2rem;font-weight:800;margin-bottom:2.2rem;}
.modal-note{font-size:1.28rem;color:#777;line-height:1.65;margin-bottom:2.6rem;text-align:left;}
.modal-actions{display:flex;gap:1.6rem;}
.modal-btn{flex:1;height:4.4rem;border-radius:2.4rem;font-size:1.35rem;font-weight:800;border:none;cursor:pointer;}
.modal-cancel{background:#f7f7f7;color:#231916;}
.modal-ok{background:linear-gradient(90deg,#7bc3e2,#489afb);color:#fff;}
</style>
</head>
<body>
<main class="page">
<header class="header">
<div class="logo">
<div class="logo-icon">T</div>
Ticket Dive
</div>
<div class="header-right">
<div class="search">🔍</div>
<button class="login-btn">ログイン</button>
</div>
</header>
<section class="ticket-section">
<div class="ticket">
<div class="image-area" id="imageArea">
<div class="image-blur" id="imageBlur"></div>
<div class="image-main" id="imageMain"></div>
<div class="stamp" id="stamp">
<div class="c1"></div><div class="c2"></div>
<div class="top">入場済</div>
<div class="time" id="stampTime">--:--</div>
<div class="bot">入場済</div>
</div>
</div>
<div class="details">
<div class="title" id="title">祭-絢瀬まつり生誕祭2026-</div>
<div class="venue" id="venue">Twin Box GARAGE</div>
<div class="date-row">
<span class="date" id="date">11/1</span>
<span class="weekday" id="weekday">(日)</span>
<div class="times">OPEN<br><b id="openTime">17:30</b><br>START<br><b id="startTime">18:00</b></div>
</div>
<div class="bottom-info">
<div class="name-area">
<div><span class="name" id="name">名前</span>さま</div>
<div class="favorite" id="favorite">お目当て</div>
<div class="ticket-name" id="ticketName">チケット名</div>
</div>
<div class="number" id="ticketType">VIP-1</div>
</div>
</div>
</div>
</section>
</main>
<div class="footer"><button class="enter-btn" id="enterBtn">入場する</button></div>

<div class="modal-backdrop" id="modal">
<div class="modal">
<button class="modal-close" id="modalClose">×</button>
<div class="modal-warning">必ず係員が操作してください</div>
<div class="modal-title">本当に入場しますか?</div>
<div class="modal-note">誤って入場するを押した場合、この操作は取り消せません。</div>
<div class="modal-actions">
<button class="modal-btn modal-cancel" id="modalCancel">キャンセル</button>
<button class="modal-btn modal-ok" id="modalOk">入場する</button>
</div>
</div>
</div>

<script>
const p = new URLSearchParams(location.search);
const data = {
image: p.get('image')||'',
title: p.get('title')||'祭-絢瀬まつり生誕祭2026-',
venue: p.get('venue')||'Twin Box GARAGE',
date: p.get('date')||'11/1',
weekday: p.get('weekday')||'(日)',
openTime: p.get('openTime')||'17:30',
startTime: p.get('startTime')||'18:00',
name: p.get('name')||'名前',
favorite: p.get('favorite')||'お目当て',
ticketName: p.get('ticketName')||'チケット名',
ticketType: p.get('ticketType')||'VIP-1',
accent: p.get('ticketColor')||'#4a90e2',
bg: p.get('bodyColor')||'#eef4fa'
};
document.documentElement.style.setProperty('--accent', data.accent);
document.documentElement.style.setProperty('--bg', data.bg);

function set(id,v){const el=document.getElementById(id);if(el)el.textContent=v;}
['title','venue','date','weekday','openTime','startTime','name','favorite','ticketName','ticketType'].forEach(id=>set(id,data[id]));

if(data.image){
document.getElementById('imageMain').style.backgroundImage=`url("${data.image}")`;
document.getElementById('imageBlur').style.backgroundImage=`url("${data.image}")`;
document.getElementById('imageArea').style.backgroundImage=`url("${data.image}")`;
}

const enterBtn=document.getElementById('enterBtn');
const modal=document.getElementById('modal');
const stamp=document.getElementById('stamp');
const stampTime=document.getElementById('stampTime');

enterBtn.onclick=()=>modal.classList.add('show');
document.getElementById('modalClose').onclick=document.getElementById('modalCancel').onclick=()=>modal.classList.remove('show');
document.getElementById('modalOk').onclick=()=>{
const now=new Date();
stampTime.textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
stamp.classList.add('show');
enterBtn.textContent='入場済';
enterBtn.classList.add('done');
enterBtn.disabled=true;
modal.classList.remove('show');
};
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show');};
</script>
</body>
</html>
